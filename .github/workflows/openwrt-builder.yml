name: OpenWrt 23.05.6 Minimal Audio Bridge

on:
  workflow_dispatch:
  repository_dispatch:

permissions:
  contents: read

env:
  REPO_URL: https://github.com/openwrt/openwrt.git
  REPO_BRANCH: v23.05.6

  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh

  UPLOAD_FIRMWARE: true
  TZ: Asia/Shanghai

jobs:

  build:
    runs-on: ubuntu-22.04

    steps:

      #
      # Checkout user's repository
      #

      - name: Checkout repository
        uses: actions/checkout@v4

      #
      # Show repository files
      #

      - name: Show repository files
        run: |
          echo "=============================================="
          echo "Repository files"
          echo "=============================================="

          pwd
          ls -la

          echo ""
          echo "Git status:"
          git status --short || true

      #
      # Check .config
      #

      - name: Check configuration file
        run: |
          echo "=============================================="
          echo "Checking .config"
          echo "=============================================="

          if [ ! -f "$CONFIG_FILE" ]; then
            echo ""
            echo "ERROR: .config not found in repository root."
            echo ""
            echo "The filename MUST be exactly:"
            echo ".config"
            echo ""
            echo "Do NOT use:"
            echo "\" .config\""
            echo "or"
            echo ".config.txt"
            echo ""

            ls -la

            exit 1
          fi

          echo ""
          echo ".config found."
          echo ""

          ls -lh "$CONFIG_FILE"

      #
      # Clone official OpenWrt 23.05.6
      #

      - name: Clone OpenWrt 23.05.6
        run: |
          echo "=============================================="
          echo "Clone OpenWrt"
          echo "=============================================="

          git clone \
            --depth=1 \
            --branch "$REPO_BRANCH" \
            "$REPO_URL" \
            openwrt

          cd openwrt

          echo ""
          echo "OpenWrt commit:"
          git log -1 --oneline

      #
      # Copy feeds configuration
      #

      - name: Load feeds configuration
        run: |
          cd openwrt

          if [ -f "../$FEEDS_CONF" ]; then
            echo "Using repository feeds.conf.default"
            cp "../$FEEDS_CONF" feeds.conf.default
          else
            echo "No custom feeds.conf.default found."
            echo "Using official OpenWrt feeds."
          fi

      #
      # Run DIY Part 1
      #

      - name: Run DIY Part 1
        run: |
          cd openwrt

          if [ -f "../$DIY_P1_SH" ]; then
            echo "Running $DIY_P1_SH"

            chmod +x "../$DIY_P1_SH"
            "../$DIY_P1_SH"
          else
            echo "No DIY Part 1 script found."
          fi

      #
      # Update feeds
      #

      - name: Update feeds
        run: |
          cd openwrt

          ./scripts/feeds update -a

      #
      # Install feeds
      #

      - name: Install feeds
        run: |
          cd openwrt

          ./scripts/feeds install -a

      #
      # IMPORTANT:
      # Copy EXACT .config from repository root
      #

      - name: Install exact .config
        run: |
          echo "=============================================="
          echo "Install exact .config"
          echo "=============================================="

          if [ ! -f ".config" ]; then
            echo "ERROR: repository .config disappeared."
            exit 1
          fi

          cp ".config" openwrt/.config

          echo ""
          echo "Configuration copied:"
          ls -lh openwrt/.config

          echo ""
          echo "Target configuration before defconfig:"
          grep -E \
            'CONFIG_TARGET_mvebu|CONFIG_TARGET_mvebu_cortexa9_DEVICE_linksys_wrt1900acs' \
            openwrt/.config || true

      #
      # Run existing DIY Part 2
      #
      # IMPORTANT:
      # Keep the Run #8 WiFi-removal script unchanged.
      #

      - name: Run DIY Part 2
        run: |
          cd openwrt

          if [ -f "../$DIY_P2_SH" ]; then
            echo "Running $DIY_P2_SH"

            chmod +x "../$DIY_P2_SH"
            "../$DIY_P2_SH"
          else
            echo "ERROR: diy-part2.sh not found."
            exit 1
          fi

      #
      # Generate final configuration
      #

      - name: Make defconfig
        run: |
          cd openwrt

          make defconfig

      #
      # Verify final target
      #

      - name: Verify WRT1900ACS target
        run: |
          cd openwrt

          echo "=============================================="
          echo "Verify target"
          echo "=============================================="

          grep -E \
            'CONFIG_TARGET_mvebu=y|CONFIG_TARGET_mvebu_cortexa9=y|CONFIG_TARGET_mvebu_cortexa9_DEVICE_linksys_wrt1900acs=y' \
            .config

          if ! grep -q \
            '^CONFIG_TARGET_mvebu_cortexa9_DEVICE_linksys_wrt1900acs=y' \
            .config; then

            echo ""
            echo "ERROR: WRT1900ACS target is NOT selected."
            exit 1
          fi

          echo ""
          echo "WRT1900ACS target confirmed."

      #
      # Verify network core
      #

      - name: Verify network core
        run: |
          cd openwrt

          echo "=============================================="
          echo "Verify network core"
          echo "=============================================="

          grep -E \
            '^CONFIG_PACKAGE_(dnsmasq|netifd|firewall4)=y' \
            .config

          for p in \
            CONFIG_PACKAGE_dnsmasq \
            CONFIG_PACKAGE_netifd \
            CONFIG_PACKAGE_firewall4
          do
            if ! grep -q "^${p}=y" .config; then
              echo "ERROR: $p is missing."
              exit 1
            fi
          done

          echo ""
          echo "Network core confirmed."

      #
      # Verify DSA / PHY
      #
      # IMPORTANT:
      # Do NOT require CONFIG_PACKAGE_kmod-dsa.
      #
      # OpenWrt 23.05.6 handles the DSA core through
      # the kernel/target configuration and it is not
      # necessarily represented as a standalone
      # CONFIG_PACKAGE_kmod-dsa=y entry after defconfig.
      #
      # The WRT1900ACS-specific switch driver and the
      # required PHY support are what matter here.
      #

      - name: Verify DSA PHY stack
        run: |
          cd openwrt

          echo "=============================================="
          echo "Verify DSA / PHY"
          echo "=============================================="

          echo ""
          echo "--- DSA / PHY related configuration ---"

          grep -E \
            'CONFIG_(PACKAGE_)?(kmod-dsa-mv88e6xxx|PACKAGE_kmod-ptp|PACKAGE_kmod-phy-marvell|PACKAGE_kmod-libphy|PHYLIB|MARVELL_PHY)' \
            .config || true

          echo ""
          echo "--- Check WRT1900ACS DSA driver ---"

          if ! grep -q \
            '^CONFIG_PACKAGE_kmod-dsa-mv88e6xxx=y' \
            .config; then

            echo ""
            echo "ERROR: kmod-dsa-mv88e6xxx is missing."
            exit 1
          fi

          echo "kmod-dsa-mv88e6xxx: OK"

          echo ""
          echo "--- Check PHY configuration ---"

          #
          # The following are checked in a tolerant way.
          # Some of them may be built into the kernel rather
          # than appearing as standalone package selections.
          #

          PHY_OK=0

          if grep -q '^CONFIG_PACKAGE_kmod-phy-marvell=y' .config; then
            echo "kmod-phy-marvell package: OK"
            PHY_OK=1
          fi

          if grep -q '^CONFIG_MARVELL_PHY=y' .config; then
            echo "CONFIG_MARVELL_PHY=y: OK"
            PHY_OK=1
          fi

          if grep -q '^CONFIG_PACKAGE_kmod-libphy=y' .config; then
            echo "kmod-libphy package: OK"
            PHY_OK=1
          fi

          if grep -q '^CONFIG_PHYLIB=y' .config; then
            echo "CONFIG_PHYLIB=y: OK"
            PHY_OK=1
          fi

          if [ "$PHY_OK" -eq 0 ]; then
            echo ""
            echo "ERROR: No valid Marvell PHY support detected."
            exit 1
          fi

          echo ""
          echo "DSA / PHY stack confirmed."

      #
      # Verify Advanced Reboot
      #

      - name: Verify Advanced Reboot
        run: |
          cd openwrt

          echo "=============================================="
          echo "Verify Advanced Reboot"
          echo "=============================================="

          if ! grep -q \
            '^CONFIG_PACKAGE_luci-app-advanced-reboot=y' \
            .config; then

            echo "ERROR: luci-app-advanced-reboot is missing."
            exit 1
          fi

          if ! grep -q \
            '^CONFIG_PACKAGE_luci-i18n-advanced-reboot-zh-cn=y' \
            .config; then

            echo "ERROR: Chinese Advanced Reboot translation is missing."
            exit 1
          fi

          if ! grep -q \
            '^CONFIG_PACKAGE_linksys-reboot=y' \
            .config; then

            echo "ERROR: linksys-reboot is missing."
            exit 1
          fi

          echo ""
          echo "Advanced Reboot confirmed."

      #
      # Verify Audio Bridge runtime
      #

      - name: Verify Audio Bridge runtime
        run: |
          cd openwrt

          echo "=============================================="
          echo "Verify Audio Bridge runtime"
          echo "=============================================="

          for p in \
            CONFIG_PACKAGE_python3 \
            CONFIG_PACKAGE_python3-aiohttp \
            CONFIG_PACKAGE_python3-yaml \
            CONFIG_PACKAGE_avahi-daemon \
            CONFIG_PACKAGE_kmod-usb-storage \
            CONFIG_PACKAGE_block-mount
          do
            if ! grep -q "^${p}=y" .config; then
              echo "ERROR: $p is missing."
              exit 1
            fi
          done

          echo ""
          echo "Audio Bridge runtime confirmed."

      #
      # Verify LuCI Status remains enabled
      #

      - name: Verify LuCI Status remains enabled
        run: |
          cd openwrt

          echo "=============================================="
          echo "Verify LuCI Status"
          echo "=============================================="

          if ! grep -q \
            '^CONFIG_PACKAGE_luci-mod-status=y' \
            .config; then

            echo "ERROR: luci-mod-status is missing."
            exit 1
          fi

          echo ""
          echo "LuCI Status remains enabled."

      #
      # Verify unwanted packages
      #

      - name: Verify unwanted packages are disabled
        run: |
          cd openwrt

          echo "=============================================="
          echo "Verify unwanted packages"
          echo "=============================================="

          forbidden_packages="
          CONFIG_PACKAGE_3proxy
          CONFIG_PACKAGE_chinadns-ng
          CONFIG_PACKAGE_dns2tcp
          CONFIG_PACKAGE_ipt2socks
          CONFIG_PACKAGE_mihomo
          CONFIG_PACKAGE_luci-app-passwall
          CONFIG_PACKAGE_luci-app-passwall2
          CONFIG_PACKAGE_luci-app-ssr-plus
          CONFIG_PACKAGE_luci-app-openclash
          CONFIG_PACKAGE_luci-app-nlbwmon
          CONFIG_PACKAGE_luci-app-qos
          CONFIG_PACKAGE_luci-app-sqm
          CONFIG_PACKAGE_luci-app-turboacc
          CONFIG_PACKAGE_luci-app-ddns
          CONFIG_PACKAGE_luci-app-upnp
          CONFIG_PACKAGE_luci-app-vlmcsd
          CONFIG_PACKAGE_luci-app-vsftpd
          CONFIG_PACKAGE_luci-app-wol
          CONFIG_PACKAGE_kmod-mwlwifi
          CONFIG_PACKAGE_mwlwifi-firmware-88w8864
          CONFIG_PACKAGE_luci-proto-ipv6
          CONFIG_PACKAGE_luci-proto-ppp
          CONFIG_PACKAGE_ppp
          CONFIG_PACKAGE_ppp-mod-pppoe
          "

          for p in $forbidden_packages; do
            if grep -q "^${p}=y" .config; then
              echo "ERROR: unwanted package enabled: $p"
              exit 1
            fi
          done

          echo ""
          echo "Unwanted package check passed."

      #
      # Show final important configuration
      #

      - name: Show final configuration summary
        run: |
          cd openwrt

          echo "=============================================="
          echo "FINAL CONFIGURATION SUMMARY"
          echo "=============================================="

          echo ""
          echo "--- TARGET ---"

          grep '^CONFIG_TARGET_' .config | grep '=y' || true

          echo ""
          echo "--- NETWORK ---"

          grep -E \
            '^CONFIG_PACKAGE_(dnsmasq|netifd|firewall4)=y' \
            .config || true

          echo ""
          echo "--- DSA / PHY ---"

          grep -E \
            'CONFIG_(PACKAGE_)?(kmod-dsa-mv88e6xxx|PACKAGE_kmod-ptp|PACKAGE_kmod-phy-marvell|PACKAGE_kmod-libphy|PHYLIB|MARVELL_PHY)' \
            .config || true

          echo ""
          echo "--- ADVANCED REBOOT ---"

          grep -E \
            '^CONFIG_PACKAGE_(linksys-reboot|luci-app-advanced-reboot|luci-i18n-advanced-reboot-zh-cn)=y' \
            .config || true

          echo ""
          echo "--- AUDIO BRIDGE ---"

          grep -E \
            '^CONFIG_PACKAGE_(python3|python3-aiohttp|python3-yaml|avahi-daemon)=y' \
            .config || true

          echo ""
          echo "--- USB ---"

          grep -E \
            '^CONFIG_PACKAGE_(kmod-usb-storage|block-mount)=y' \
            .config || true

          echo ""
          echo "--- STATUS ---"

          grep \
            '^CONFIG_PACKAGE_luci-mod-status=y' \
            .config || true

      #
      # Download package sources
      #

      - name: Download package sources
        run: |
          cd openwrt

          make download -j$(nproc) || make download -j1 V=s

      #
      # Compile firmware
      #

      - name: Build firmware
        run: |
          cd openwrt

          echo "=============================================="
          echo "BUILD OPENWRT 23.05.6"
          echo "=============================================="

          make -j$(nproc) || make -j1 V=s

      #
      # Prepare firmware artifacts
      #

      - name: Prepare firmware artifacts
        run: |
          mkdir -p firmware

          echo "=============================================="
          echo "Firmware files"
          echo "=============================================="

          find openwrt/bin/targets/mvebu/cortexa9 \
            -maxdepth 2 \
            -type f \
            \( \
              -name '*.bin' \
              -o -name '*.img' \
              -o -name '*.tar' \
              -o -name '*.gz' \
            \) \
            -print

          cp -r \
            openwrt/bin/targets/mvebu/cortexa9/* \
            firmware/

          echo ""
          echo "Final firmware directory:"
          ls -lah firmware/

      #
      # Upload firmware
      #

      - name: Upload firmware
        if: env.UPLOAD_FIRMWARE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-23.05.6-wrt1900acs-audio-bridge
          path: firmware/
          if-no-files-found: error
          retention-days: 30
