name: OpenWrt 23.05.6 Minimal Audio Bridge

on:
  workflow_dispatch:
  repository_dispatch:

env:
  REPO_URL: https://github.com/openwrt/openwrt.git
  REPO_BRANCH: v23.05.6
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

    - name: Checkout
      uses: actions/checkout@main

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force

        sudo -E apt-get -qq update

        sudo -E apt-get -qq install \
          build-essential \
          clang \
          flex \
          bison \
          g++ \
          gawk \
          gcc-multilib \
          g++-multilib \
          gettext \
          git \
          libncurses5-dev \
          libssl-dev \
          python3 \
          python3-distutils \
          rsync \
          unzip \
          zlib1g-dev \
          file \
          wget \
          curl \
          time

        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean

        sudo timedatectl set-timezone "$TZ"

        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    #
    # OpenWrt 23.05.6
    #

    - name: Clone OpenWrt 23.05.6
      working-directory: /workdir
      run: |
        git clone \
          --branch "$REPO_BRANCH" \
          --depth 1 \
          "$REPO_URL" \
          openwrt

        cd openwrt

        echo "================================="
        echo "OpenWrt source commit:"
        git rev-parse HEAD

        echo "OpenWrt source version:"
        git describe --tags --always

        echo "================================="

        ln -sf /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"

    #
    # Custom feeds
    #

    - name: Load custom feeds
      run: |
        [ -e "$FEEDS_CONF" ] && \
          mv "$FEEDS_CONF" openwrt/feeds.conf.default

        chmod +x "$DIY_P1_SH"

        cd openwrt

        "$GITHUB_WORKSPACE/$DIY_P1_SH"

    #
    # Update feeds
    #

    - name: Update feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a

    #
    # Install feeds
    #

    - name: Install feeds
      run: |
        cd openwrt
        ./scripts/feeds install -a

    #
    # Custom configuration
    #

    - name: Load custom configuration
      run: |
        [ -e files ] && \
          mv files openwrt/files

        [ -e "$CONFIG_FILE" ] && \
          mv "$CONFIG_FILE" openwrt/.config

        chmod +x "$DIY_P2_SH"

        cd openwrt

        "$GITHUB_WORKSPACE/$DIY_P2_SH"

    #
    # Generate final configuration
    #

    - name: Generate and validate configuration
      run: |
        cd openwrt

        make defconfig

        echo "================================="
        echo "TARGET"
        echo "================================="

        grep '^CONFIG_TARGET.*DEVICE.*=y' .config

        echo "================================="
        echo "NETWORK CORE"
        echo "================================="

        grep -E \
          '^CONFIG_PACKAGE_(dnsmasq|netifd|firewall4)=' \
          .config || true

        echo "================================="
        echo "AUDIO BRIDGE RUNTIME"
        echo "================================="

        grep -E \
          '^CONFIG_PACKAGE_(python3|python3-aiohttp|python3-yaml|avahi-daemon)=' \
          .config || true

        echo "================================="
        echo "USB"
        echo "================================="

        grep -E \
          '^CONFIG_PACKAGE_(kmod-usb2|kmod-usb3|kmod-fs-ext4|kmod-fs-f2fs|e2fsprogs|e2fsprogs-mke2fs|f2fs-tools)=' \
          .config || true

        echo "================================="
        echo "FORBIDDEN PACKAGES CHECK"
        echo "================================="

        if grep -E \
          '^CONFIG_PACKAGE_(kmod-mwlwifi|mwlwifi-firmware-88w8864|wpad-basic-mbedtls|luci-app-passwall|luci-app-ssr-plus|luci-app-openclash|xray-core|mihomo|3proxy|chinadns-ng|miniupnpd|nlbwmon|luci-app-nlbwmon|luci-app-qos|luci-app-sqm)=(y|m)' \
          .config
        then
          echo "ERROR: Forbidden package detected."
          exit 1
        fi

        echo "Configuration validation passed."

    #
    # Download
    #

    - name: Download package
      run: |
        cd openwrt

        make download -j8

        find dl -size -1024c \
          -exec ls -l {} \;

        find dl -size -1024c \
          -exec rm -f {} \;

    #
    # Compile
    #

    - name: Compile firmware
      id: compile
      run: |
        cd openwrt

        echo "$(nproc) thread compile"

        make -j$(nproc) || \
          make -j1 V=s

        echo "status=success" >> "$GITHUB_OUTPUT"

        grep '^CONFIG_TARGET.*DEVICE.*=y' .config \
          | sed -r 's/.*DEVICE_(.*)=y/\1/' \
          > DEVICE_NAME

        [ -s DEVICE_NAME ] && \
          echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> "$GITHUB_ENV"

        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" \
          >> "$GITHUB_ENV"

    #
    # Check disk usage
    #

    - name: Check space usage
      if: (!cancelled())
      run: |
        df -hT

    #
    # Final configuration check
    #

    - name: Show final package configuration
      if: steps.compile.outputs.status == 'success'
      run: |
        cd openwrt

        echo "================================="
        echo "FINAL NETWORK CORE"
        echo "================================="

        grep -E \
          '^CONFIG_PACKAGE_(dnsmasq|netifd|firewall4)=' \
          .config || true

        echo "================================="
        echo "FINAL AUDIO RUNTIME"
        echo "================================="

        grep -E \
          '^CONFIG_PACKAGE_(python3|python3-aiohttp|python3-yaml|avahi-daemon)=' \
          .config || true

        echo "================================="
        echo "FINAL USB SUPPORT"
        echo "================================="

        grep -E \
          '^CONFIG_PACKAGE_(kmod-usb2|kmod-usb3|kmod-fs-ext4|kmod-fs-f2fs|e2fsprogs|e2fsprogs-mke2fs|f2fs-tools)=' \
          .config || true

        echo "================================="
        echo "FORBIDDEN PACKAGE CHECK"
        echo "================================="

        if grep -E \
          '^CONFIG_PACKAGE_(kmod-mwlwifi|mwlwifi-firmware-88w8864|wpad-basic-mbedtls|luci-app-passwall|luci-app-ssr-plus|luci-app-openclash|xray-core|mihomo|3proxy|chinadns-ng|miniupnpd|nlbwmon|luci-app-nlbwmon|luci-app-qos|luci-app-sqm)=(y|m)' \
          .config
        then
          echo "ERROR: Forbidden package detected."
          exit 1
        fi

        echo "Final configuration passed."

    #
    # Organize firmware
    #

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*

        rm -rf packages

        echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"

        echo "status=success" >> "$GITHUB_OUTPUT"

    #
    # Upload firmware
    #

    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}
